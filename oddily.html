<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>statiSTIS – Oddíly</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/2.3.2/css/dataTables.dataTables.min.css">
</head>

<body>
<header>
    <h1>
        <a class="site-title" href="index.html">
            <img class="site-logo" src="images/logo.png" alt="">
            <span>statiSTIS</span>
        </a>
    </h1>
    <nav>
        <a href="index.html">Domů</a>
        <a href="hraci.html">Hráči</a>
        <a href="skokani.html">Skokani</a>
        <a href="oddily.html">Oddíly</a>
        <a href="hledat-hrace.html">Hledat hráče</a>
        <a href="porovnat-hrace.html">Porovnat hráče</a>
        <a href="o-projektu.html">O projektu</a>
    </nav>
</header>

<main>
    <section id="team-search-view">
        <h2>
            Žebříček oddílů
            <span class="info-tooltip">
                <button type="button" class="info-button" aria-label="Metodika žebříčku oddílů" aria-describedby="team-ranking-info">i</button>
                <span id="team-ranking-info" class="info-tooltip-text" role="tooltip">Oddíly jsou seřazeny podle průměrného STR jejich čtyř nejlepších aktivních hráčů. Pokud má oddíl méně než čtyři hráče, počítá se průměr ze všech.</span>
            </span>
            k
            <select id="team-overview-season" class="season-select" aria-label="Datum žebříčku"></select>
        </h2>

        <div class="ranking-filter">
            <span class="ranking-filter-label">Svaz:</span>
            <nav id="association-selection" class="sex-selection" aria-label="Výběr svazu"></nav>
        </div>

        <p id="team-search-status" class="status-message" aria-live="polite" hidden></p>

        <table id="team-ranking-overview" class="display" style="width:100%"></table>
    </section>

    <section id="team-detail-view" hidden>
        <a id="team-back-link" href="oddily.html" class="back-link">Zpět na vyhledávání</a>
        <h2 id="team-name"></h2>
        <p>Žebříček hráčů k <select id="team-detail-season" class="season-select" aria-label="Datum žebříčku"></select></p>
        <nav id="sex-selection" class="sex-selection" aria-label="Pohlaví hráčů"></nav>
        <table id="team-ranking" class="display" style="width:100%"></table>
    </section>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/2.3.2/js/dataTables.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/tables.js"></script>
<script src="js/teams.js"></script>
</body>
</html>
